- name: "Molecule | Verify | Check OAuth in CLI and the serving FPM pool"
  ansible.builtin.command:
    argv: "{{ item['argv'] }}"
  vars:
    __testing_response: "{{ __testing_oauth_probe['stdout'] | ansible.builtin.from_json }}"
  changed_when:
    - false
  loop:
    - sapi: "cli"
      argv:
        - "php"
        - "/var/lib/molecule-php/runtime.php"
    - sapi: "fpm-fcgi"
      argv:
        - "python3"
        - "/var/lib/molecule-php/fpm_request.py"
  # A graceful reload can finish after systemctl returns.
  until:
    - __testing_oauth_probe['rc'] == 0
    - __testing_oauth_probe['stderr'] == ''
    - __testing_response['sapi'] == item['sapi']
    - __testing_response['oauth'] == __testing_oauth_expected
    - __testing_response['oauth_class'] == __testing_oauth_expected
  retries: 5
  delay: 1
  loop_control:
    label: "{{ item['sapi'] }} (OAuth expected: {{ __testing_oauth_expected }})"
  register: __testing_oauth_probe
