## Rejection tests: init-time input validation
#
# Re-run only the role's init with hostile inputs and assert the expected
# assert stops the run. Evaluation-only (tasks_from: init never touches the
# system), so these are safe on every platform.

- name: "Molecule | Verify | Validate rejection of a malformed run_php_version"
  block:

    - name: "Molecule | Verify | Run init with a malformed run_php_version (must fail)"
      ansible.builtin.include_role:
        name: "foundata.php.run"
        tasks_from: "init"
      vars:
        run_php_version: "8.3; rm -rf /"

    - name: "Molecule | Verify | Fail because the malformed run_php_version was accepted"
      ansible.builtin.fail:
        msg: >-
          run_php_version '8.3; rm -rf /' passed the role's init although it is
          neither "default" nor a MAJOR.MINOR version. The value reaches package
          names and the EL9 "dnf module enable" argument, so it must be rejected.

  rescue:

    - name: "Molecule | Verify | Assert the version format assert caused the failure"
      ansible.builtin.assert:
        that:
          - ansible_failed_task['name'] is
            ansible.builtin.search("run_php_version is 'default' or a MAJOR.MINOR version")
        fail_msg: >-
          The failure was raised by '{{ ansible_failed_task['name'] }}', not by the
          run_php_version format assert.
        success_msg: >-
          A malformed run_php_version is rejected by the role's init.


- name: "Molecule | Verify | Validate rejection of a path-escaping pool name"
  block:

    - name: "Molecule | Verify | Run init with a path-escaping pool name (must fail)"
      ansible.builtin.include_role:
        name: "foundata.php.run"
        tasks_from: "init"
      vars:
        run_php_fpm_pools:
          "../../etc/cron.d/evil":
            pm: "static"

    - name: "Molecule | Verify | Fail because the path-escaping pool name was accepted"
      ansible.builtin.fail:
        msg: >-
          The pool name '../../etc/cron.d/evil' passed the role's init although pool
          names become pool.d/<name>.conf paths and [<name>] section headers, so it
          must be rejected.

  rescue:

    - name: "Molecule | Verify | Assert the pool name assert caused the failure"
      ansible.builtin.assert:
        that:
          - ansible_failed_task['name'] is
            ansible.builtin.search('every key in run_php_fpm_pools is a safe pool name')
        fail_msg: >-
          The failure was raised by '{{ ansible_failed_task['name'] }}', not by the
          pool name assert.
        success_msg: >-
          A path-escaping pool name is rejected by the role's init.


## Unfulfillable run_php_version pin (platforms shipping a single PHP series)
#
# openSUSE Leap has no parallel package family and no module stream to select
# a PHP version from, so a pin must resolve to the distribution stream instead
# of being passed through (which would have the role install one version while
# reporting another). Evaluation-only: the role is not run again here, the
# lazy __run_php_version_effective is re-rendered with an overriding pin.

- name: "Molecule | Verify | Assert an unfulfillable run_php_version pin falls back to the distribution stream"
  vars:
    run_php_version: "8.3"
  ansible.builtin.assert:
    that:
      - not __run_php_version_pin_supported
      - __run_php_version_effective == __run_php_version_distribution_default
    fail_msg: >-
      With run_php_version pinned to '8.3', __run_php_version_effective resolved to
      '{{ __run_php_version_effective }}' instead of the distribution stream
      '{{ __run_php_version_distribution_default }}'. On this platform the pin cannot
      be honored, so the role would install a different version than it reports.
    success_msg: >-
      An unfulfillable run_php_version pin falls back to the distribution stream
      '{{ __run_php_version_distribution_default }}'.
  when:
    - ansible_facts['os_family'] == 'Suse'


## EL9 php DNF module stream (pinned run_php_version)
#
# EL9 is the only supported platform family where alternative PHP versions are
# DNF module streams instead of parallel package families, so the stream is
# host state the role has to manage in both directions. The converge runs with
# run_php_version "default", which must not touch the module at all, leaving
# the pinned code paths without coverage above.
#
# This block runs LAST in the verify stage on purpose: it uninstalls the
# converge deployment and installs a different stream afterwards, so nothing
# that relies on the converge state may follow it. Its own uninstall steps are
# in turn the last thing inside the block.

- name: "Molecule | Verify | Validate the EL9 php DNF module stream handling (integration)"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == '9'
  block:

    - name: "Molecule | Verify | Read the enabled php module stream after the converge"
      ansible.builtin.command:
        cmd: "dnf -q module list --enabled php"
      register: "__testing_module_stream_baseline"
      changed_when:
        - false
      # a host without any enabled stream answers with rc 1 and an empty stdout
      failed_when:
        - false


    - name: "Molecule | Verify | Assert a run without a pinned version leaves the module stream untouched"
      ansible.builtin.assert:
        that:
          - __testing_module_stream_baseline['stdout'] is not ansible.builtin.search('(?m)^php\s+[0-9]')
        fail_msg: >-
          A converge with run_php_version "default" left a php module stream enabled
          ({{ __testing_module_stream_baseline['stdout'] }}), although the role must
          not touch the module stream unless a concrete version is pinned.
        success_msg: >-
          A run without a pinned version left the php module stream untouched.


    # Hands-off contract: a stream enabled outside of this role must survive an
    # uninstall that does not pin a version.
    - name: "Molecule | Verify | Enable a php module stream by hand (simulated operator)"
      ansible.builtin.command:
        cmd: "dnf -y module enable php:8.1"
      changed_when:
        - true


    # Simulate a pool that was renamed since deployment: the marker-carrying
    # file exists on disk but is absent from run_php_fpm_pools, so only the
    # uninstall's marker sweep can find it.
    - name: "Molecule | Verify | Plant a renamed historical pool file before the uninstall"
      ansible.builtin.copy:
        content: |
          {{ __run_php_config_file_marker }}
          [renamed-leftover]
          user = nobody
          pm = static
          pm.max_children = 1
        dest: "{{ __run_php_config_fpm_pool_dir_path }}/renamed-leftover.conf"
        owner: "root"
        group: "root"
        mode: "u=rw,g=,o="


    - name: "Molecule | Verify | Uninstall the role without a pinned version"
      ansible.builtin.include_role:
        name: "foundata.php.run"
      vars:
        run_php_state: "absent"
        run_php_version: "default"


    - name: "Molecule | Verify | Stat role-managed config files after the uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: "__testing_uninstall_leftover_stat"
      loop:
        - "{{ __run_php_config_fpm_pool_dir_path }}/renamed-leftover.conf"
        - "{{ __run_php_config_fpm_pool_dir_path }}/testpool.conf"
        - "{{ __run_php_config_ini_shared_dir_path }}/{{ __run_php_config_ini_dropin_filename }}"


    - name: "Molecule | Verify | Assert the uninstall removed the role's configuration"
      ansible.builtin.assert:
        that:
          - __testing_uninstall_leftover_stat['results']
            | ansible.builtin.selectattr('stat.exists')
            | ansible.builtin.list
            | ansible.builtin.length == 0
        fail_msg: >-
          Role-managed configuration survived run_php_state "absent":
          {{ __testing_uninstall_leftover_stat['results']
             | ansible.builtin.selectattr('stat.exists')
             | ansible.builtin.map(attribute='item') | ansible.builtin.list }}.
          Pool files can carry credentials, and a renamed pool is only found by the
          ownership marker sweep.
        success_msg: >-
          The uninstall removed the declared pool, the renamed historical pool and
          the INI drop-in.


    - name: "Molecule | Verify | Read the enabled php module stream after the unpinned uninstall"
      ansible.builtin.command:
        cmd: "dnf -q module list --enabled php"
      register: "__testing_module_stream_unpinned"
      changed_when:
        - false
      failed_when:
        - false


    - name: "Molecule | Verify | Assert the unpinned uninstall kept the operator's module stream"
      ansible.builtin.assert:
        that:
          - __testing_module_stream_unpinned['stdout'] is ansible.builtin.search('(?m)^php\s+8\.1')
        fail_msg: >-
          The php:8.1 module stream enabled outside of this role did not survive an
          uninstall with run_php_version "default":
          {{ __testing_module_stream_unpinned['stdout'] }}
        success_msg: >-
          The uninstall without a pinned version kept the operator's php:8.1 module stream.


    # Pinned install on a host without any enabled stream: the stream detection
    # has to cope with the empty "dnf module list --enabled" output a fresh EL9
    # host produces, and the pinned stream has to end up enabled.
    - name: "Molecule | Verify | Reset the php module stream to prepare the pinned install"
      ansible.builtin.command:
        cmd: "dnf -y module reset php"
      changed_when:
        - true


    - name: "Molecule | Verify | Install a pinned PHP version stream (minimal set)"
      ansible.builtin.include_role:
        name: "foundata.php.run"
      vars:
        run_php_state: "present"
        run_php_version: "8.2"
        run_php_sapis:
          - "cli"
        run_php_extensions_enabled: []
        run_php_extension_settings: {}
        run_php_fpm_service_state: "unmanaged"


    - name: "Molecule | Verify | Read the module stream and CLI package after the pinned install"
      ansible.builtin.command:
        cmd: "{{ item }}"
      register: "__testing_module_stream_pinned"
      changed_when:
        - false
      failed_when:
        - false
      loop:
        - "dnf -q module list --enabled php"
        - "rpm -q php-cli"


    - name: "Molecule | Verify | Assert the pinned version enabled the matching module stream"
      ansible.builtin.assert:
        that:
          - __testing_module_stream_pinned['results'][0]['stdout'] is ansible.builtin.search('(?m)^php\s+8\.2')
          - __testing_module_stream_pinned['results'][1]['stdout'] is ansible.builtin.search('^php-cli-8\.2\.')
        fail_msg: >-
          A pinned run_php_version "8.2" did not result in an enabled php:8.2 module
          stream with matching packages.
          Stream: {{ __testing_module_stream_pinned['results'][0]['stdout'] }},
          package: {{ __testing_module_stream_pinned['results'][1]['stdout'] }}
        success_msg: >-
          The pinned run_php_version "8.2" enabled the php:8.2 module stream and
          installed the matching php-cli package.


    # A pinned uninstall must not leave the host pinned to this role's stream.
    - name: "Molecule | Verify | Uninstall the role with the pinned version"
      ansible.builtin.include_role:
        name: "foundata.php.run"
      vars:
        run_php_state: "absent"
        run_php_version: "8.2"
        run_php_sapis:
          - "cli"


    - name: "Molecule | Verify | Read the enabled php module stream after the pinned uninstall"
      ansible.builtin.command:
        cmd: "dnf -q module list --enabled php"
      register: "__testing_module_stream_after_absent"
      changed_when:
        - false
      failed_when:
        - false


    - name: "Molecule | Verify | Assert the pinned uninstall reset the module stream"
      ansible.builtin.assert:
        that:
          - __testing_module_stream_after_absent['stdout'] is not ansible.builtin.search('(?m)^php\s+[0-9]')
        fail_msg: >-
          The pinned uninstall left a php module stream enabled
          ({{ __testing_module_stream_after_absent['stdout'] }}), so a later manual
          "dnf install php-*" would stay pinned to the version this role selected.
        success_msg: >-
          The pinned uninstall reset the php module stream.
