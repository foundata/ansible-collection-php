# Configuration: Tasks specific to: Debian (os_family or distribution)
#
# Only tasks specific to the platform and its functionality should be included
# here. Tasks in this file will be executed before those defined in
# config/default.yml.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
# Best-effort disabling of unmanaged extension activation symlinks.
#
# On Debian-like platforms, distribution packages install the canonical extension
# .ini file into "/etc/php/<ver>/mods-available/<ext>.ini" and create activation
# symlinks of the form "/etc/php/<ver>/<sapi>/conf.d/NN-<ext>.ini"
# (priority-prefixed, where NN is "10" for early-loading core extensions and
# "20" for the rest).
#
# When run_php_extensions_disable_unmanaged is true, the role removes those
# activation symlinks from the selected SAPIs' conf.d/ directories for any
# extension that is NOT in run_php_extensions_enabled. The canonical files in
# mods-available/ are left untouched, so a later "phpenmod <ext>" (or adding the
# extension back to the list) re-creates the symlink and re-activates
# the extension.
#
# Extensions the role classifies as builtin (__run_php_extensions_builtin) are
# always kept: php<ver>-common ships activation symlinks for its bundled
# extensions (pdo, phar, ctype, iconv, tokenizer, ...) on a fresh install, and
# removing them would break the base PHP installation (e.g. every pdo_* driver
# fails to load without pdo) just because the operator did not enumerate the
# whole base set in run_php_extensions_enabled.
#
# Files matching the role's own managed pattern (99-managed*.ini) are kept;
# regular non-symlink files are also kept (only distribution-style activation
# symlinks are touched).

# phpquery/phpenmod preserve Debian's package-defined load priorities. Package
# installation alone does not restore links removed by a previous strict run.
- name: "Config | Debian | Discover installed extension INI files"
  ansible.builtin.find:
    paths: "{{ __run_php_config_mods_available_dir_path }}"
    patterns: "*.ini"
    file_type: "file"
  register: __run_php_available_extensions

- name: "Config | Debian | Check declared extension activation per selected SAPI"
  ansible.builtin.command:
    argv:
      - "phpquery"
      - "-v"
      - "{{ __run_php_version_effective }}"
      - "-s"
      - "{{ __run_php_activation_item[1] }}"
      - "-m"
      - "{{ __run_php_activation_item[0] }}"
  changed_when:
    - false
  failed_when:
    # 1/32/33 mean disabled; 34 means an administrator changed the link target.
    - __run_php_activation_status['rc'] not in [0, 1, 32, 33]
  check_mode: false
  loop: >-
    {{
      __run_php_available_extensions['files']
      | ansible.builtin.map(attribute='path')
      | ansible.builtin.map('ansible.builtin.basename')
      | ansible.builtin.map('ansible.builtin.regex_replace', '\.ini$', '')
      | ansible.builtin.select('ansible.builtin.in', run_php_extensions_enabled)
      | ansible.builtin.product(run_php_sapis)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__run_php_activation_item"
    label: "{{ __run_php_activation_item[0] }} / {{ __run_php_activation_item[1] }}"
  register: __run_php_activation_status

- name: "Config | Debian | Enable declared extensions per selected SAPI"
  ansible.builtin.command:
    argv:
      - "phpenmod"
      - "-v"
      - "{{ __run_php_version_effective }}"
      - "-s"
      - "{{ __run_php_activation_result_item['__run_php_activation_item'][1] }}"
      - "{{ __run_php_activation_result_item['__run_php_activation_item'][0] }}"
  when:
    - __run_php_activation_result_item['rc'] != 0
  changed_when:
    - true
  loop: "{{ __run_php_activation_status['results'] }}"
  loop_control:
    loop_var: "__run_php_activation_result_item"
    label: "{{ __run_php_activation_result_item['__run_php_activation_item'] | ansible.builtin.join(' / ') }}"
  notify:
    - "run_php_reload_php_fpm"

- name: "Config | Debian | Discover existing extension activation symlinks per selected SAPI"
  ansible.builtin.find:
    paths: "{{ __run_php_disable_unmanaged_target_item['dir'] }}"
    patterns: "^[0-9]+-.+\\.ini$"
    use_regex: true
    file_type: "link"
  when:
    - run_php_extensions_disable_unmanaged | ansible.builtin.bool

  loop: >-
    {{
      ([{'dir': __run_php_config_ini_fpm_dir_path}] if __run_php_fpm_enabled else [])
      + ([{'dir': __run_php_config_ini_cli_dir_path}] if __run_php_cli_enabled else [])
    }}
  loop_control:
    loop_var: "__run_php_disable_unmanaged_target_item"
    label: "{{ __run_php_disable_unmanaged_target_item['dir'] }}"
  register: "__run_php_disable_unmanaged_existing"
- name: "Config | Debian | Remove activation symlinks of unmanaged non-builtin extensions"
  ansible.builtin.file:
    path: "{{ __run_php_extension_symlink_item['path'] }}"
    state: "absent"
  vars:
    # Extract extension short name from a filename like `20-pgsql.ini`.
    __run_php_link_extension: >-
      {{
        __run_php_extension_symlink_item['path']
        | ansible.builtin.basename
        | ansible.builtin.regex_replace('^[0-9]+-(.+)\.ini$', '\1')
      }}
  when:
    - run_php_extensions_disable_unmanaged | ansible.builtin.bool
    - __run_php_link_extension not in run_php_extensions_enabled
    - __run_php_link_extension not in __run_php_extensions_builtin
  loop: >-
    {{
      __run_php_disable_unmanaged_existing['results']
      | ansible.builtin.default([])
      | ansible.builtin.map(attribute='files')
      | ansible.builtin.flatten
    }}
  loop_control:
    loop_var: "__run_php_extension_symlink_item"
    label: "{{ __run_php_extension_symlink_item['path'] }}"
  notify:
    - "run_php_reload_php_fpm"
